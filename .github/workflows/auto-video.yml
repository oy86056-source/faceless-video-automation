name: 🎬 Automated Video Generator (No API Keys)

on:
  schedule:
    - cron: '0 12 * * *'
  
  workflow_dispatch:
    inputs:
      video_count:
        description: 'Number of videos to generate'
        required: true
        default: '1'

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak espeak-ng
          ffmpeg -version
          espeak --version
      
      - name: 📚 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_local.txt
          pip install pyttsx3
      
      - name: 📁 Create directories
        run: |
          mkdir -p generated_videos
          mkdir -p logs
      
      - name: 🎬 Generate videos (No API Keys!)
        env:
          VIDEO_COUNT: ${{ github.event.inputs.video_count || 1 }}
        run: |
          python video_generator_local_no_keys.py
      
      - name: 📊 Show results
        if: always()
        run: |
          echo "=== Generated Videos ==="
          ls -lh generated_videos/ || echo "No videos generated"
          echo ""
          echo "=== Logs ==="
          tail -20 video_generation.log || echo "No logs"
      
      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: generated_videos/
          retention-days: 30
      
      - name: 📋 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-logs
          path: video_generation.log
          retention-days: 7
      
      - name: 💾 Commit to repository
        if: success()
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Video Bot"
          git add generated_videos/ || true
          git commit -m "🎬 Generated videos - $(date +'%Y-%m-%d %H:%M:%S')" || true
          git push || true
      
      - name: ✅ Success notification
        if: success()
        run: |
          echo "✅ Video generation completed successfully!"
          echo "📍 Videos are in the artifacts"
          echo "🎉 All done without any API keys!"
