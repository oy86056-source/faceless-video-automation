name: 🎬 Automated Video Generator (No API Keys)

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      video_count:
        description: 'Number of videos'
        required: true
        default: '1'

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak espeak-ng
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements_local.txt
          pip install pyttsx3
      
      - name: Create directories
        run: |
          mkdir -p generated_videos
          mkdir -p logs
      
      - name: Generate videos
        env:
          VIDEO_COUNT: ${{ github.event.inputs.video_count || 1 }}
        run: python video_generator_local_no_keys.py
      
      - name: Show results
        if: always()
        run: |
          echo "=== Generated Videos ==="
          ls -lh generated_videos/ || echo "No videos"
          echo "=== Logs ==="
          cat video_generation.log || echo "No logs"
      
      - name: Commit results
        if: success()
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Video Bot"
          git add generated_videos/ || true
          git commit -m "Generated videos $(date)" || true
          git push || true
