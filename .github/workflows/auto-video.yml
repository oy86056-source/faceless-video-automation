name: 🎬 Automated Video Generator (No API Keys)

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      video_count:
        description: 'Number of videos'
        required: true
        default: '1'

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak espeak-ng
      
      - run: |
          pip install -r requirements_local.txt
          pip install pyttsx3
      
      - run: mkdir -p generated_videos logs
      
      - env:
          VIDEO_COUNT: ${{ github.event.inputs.video_count || 1 }}
        run: python video_generator_local_no_keys.py
      
      - run: ls -lh generated_videos/ || echo "No videos"
      
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: generated_videos/
          retention-days: 30
      
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-logs
          path: video_generation.log
          retention-days: 7
      
      - if: success()
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Video Bot"
          git add generated_videos/ || true
          git commit -m "Videos - $(date)" || true
          git push || true
